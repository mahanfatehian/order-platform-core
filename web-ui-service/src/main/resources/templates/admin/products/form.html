<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/app}">
<section layout:fragment="content">
    <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/admin/products}">Products</a></li><li class="breadcrumb-item active" th:text="${editing} ? 'Edit' : 'New'">New</li></ol></nav>
    <header class="page-heading"><div><p class="eyebrow">Catalog record</p><h1 th:text="${editing} ? 'Edit product' : 'Create product'">Product</h1><p>A product can be active only after a picture is stored here.</p></div></header>
    <form class="surface surface--padded" th:action="${editing} ? @{/admin/products/{id}(id=${productId})} : @{/admin/products}" th:object="${productForm}" method="post" novalidate>
        <div th:replace="~{fragments/form-errors :: errors(${productForm})}"></div>
        <div class="row g-3">
            <div class="col-md-8"><label class="form-label" for="name">Name</label><input id="name" class="form-control" th:field="*{name}"><div class="field-error" th:errors="*{name}"></div></div>
            <div class="col-md-4"><label class="form-label" for="sku">SKU</label><input id="sku" class="form-control mono" th:field="*{sku}"><div class="field-error" th:errors="*{sku}"></div></div>
            <div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" class="form-control" rows="5" th:field="*{description}"></textarea><div class="field-error" th:errors="*{description}"></div></div>
            <div class="col-md-4"><label class="form-label" for="price">Price</label><input id="price" class="form-control" type="number" min="0" step="0.01" th:field="*{price}"><div class="field-error" th:errors="*{price}"></div></div>
            <div class="col-md-4">
                <label class="form-label" for="categoryId">Category</label>
                <select id="categoryId" class="form-select" th:field="*{categoryId}">
                    <option value="">Choose a category</option>
                    <option th:each="category : ${categories}" th:value="${category.id()}" th:text="${category.name()}">Name</option>
                </select>
                <div class="field-error" th:errors="*{categoryId}"></div>
            </div>
            <div class="col-md-4 d-flex align-items-end"><label class="form-check mb-2"><input class="form-check-input" type="checkbox" th:field="*{active}"> Active in catalog</label></div>
        </div>
        <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${editing} ? 'Save product' : 'Create product'">Save</button><a class="btn btn-quiet" th:href="@{/admin/products}">Cancel</a></div>
    </form>
    <form class="surface surface--padded mt-3" th:action="@{/admin/categories}" method="post">
        <input type="hidden" name="returnTo" th:value="${editing} ? |/admin/products/${productId}/edit| : '/admin/products/new'">
        <label class="form-label" for="category-name">New category name</label>
        <div class="d-flex gap-2">
            <input id="category-name" class="form-control" name="name" maxlength="255" required>
            <button class="btn btn-outline-primary" type="submit">Save category</button>
        </div>
    </form>
    <form th:if="${editing}" class="surface surface--padded mt-3" th:action="@{/admin/products/{id}/pictures(id=${productId})}" method="post" enctype="multipart/form-data">
        <label class="form-label" for="picture">Stored picture</label>
        <img th:if="${pictureId != null}" class="d-block mb-3 product-picture" th:src="@{/app/catalog/{id}/pictures/{pictureId}(id=${productId}, pictureId=${pictureId})}" alt="Stored product picture">
        <input id="picture" class="form-control" type="file" name="file" accept="image/png,image/jpeg" required>
        <p class="form-text">PNG or JPEG only. The bytes are stored by this platform.</p>
        <button class="btn btn-outline-primary mt-2" type="submit">Upload picture</button>
    </form>
</section>
</html>

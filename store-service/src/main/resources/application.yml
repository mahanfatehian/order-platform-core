server:
  port: ${STORE_SERVICE_PORT:8083}
  shutdown: graceful
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Two @Scheduled jobs share this pool: the one-second outbox publisher and the nightly retention sweep. At the
  # Spring default of one thread the sweep blocks the publisher for as long as it runs.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}
  application:
    name: store-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Bounded so a Redis stall cannot pin a request thread. security-starter validates every access token
      # against Redis on the request path, so an unbounded command timeout, Lettuce defaults to 60s, would let
      # one slow Redis exhaust the servlet thread pool while the service itself is healthy.
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/storedb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StoreServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: store-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderprocessing.kafkacommon.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000
      public-paths:
        - /swagger-ui/**
        - /v3/api-docs/**
        - /swagger-ui.html
        - /actuator/health
        - /actuator/health/**
        - /actuator/prometheus
    store-internal:
      api-key: ${STORE_SERVICE_INTERNAL_API_KEY}

outbox:
  polling:
    interval: ${STORE_OUTBOX_POLL_INTERVAL:1000}
  batch-size: ${STORE_OUTBOX_BATCH_SIZE:50}
  max-attempts: ${STORE_OUTBOX_MAX_ATTEMPTS:5}
  retry:
    base-delay: ${STORE_OUTBOX_RETRY_BASE_DELAY:1000}
    max-delay: ${STORE_OUTBOX_RETRY_MAX_DELAY:60000}

maintenance:
  outbox-retention: ${STORE_OUTBOX_RETENTION:P30D}
  inbox-retention: ${STORE_INBOX_RETENTION:P30D}
  cleanup-cron: ${STORE_EVENT_CLEANUP_CRON:0 30 3 * * *}
  cleanup-batch-size: ${STORE_EVENT_CLEANUP_BATCH_SIZE:500}
  cleanup-max-batches-per-run: ${STORE_EVENT_CLEANUP_MAX_BATCHES_PER_RUN:20}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    healthcheck:
      enabled: true # Ensures Eureka only routes to healthy instances
  instance:
    prefer-ip-address: true # Crucial for Docker/multi-instance environments
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}} # Unique ID per instance
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
